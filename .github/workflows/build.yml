# Discovr CI/CD: test on every OS, audit dependencies, build the portable binaries,
# and attach them to a GitHub Release when a version tag (v*) is pushed.
name: build

on:
  push:
    branches: [main, Rejuvinate-Discovr]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pytest==9.1.1
      - name: Linux test display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pytest -q

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Fails the build when a runtime dependency has a published vulnerability.
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --disable-pip --no-deps

  build:
    name: USB app (${{ matrix.asset }})
    needs: [test, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: discovr-usb-windows-x64.zip
          # Oldest supported runner = oldest glibc = widest Linux compatibility.
          - os: ubuntu-22.04
            asset: discovr-usb-linux-x64.tar.gz
          - os: macos-14
            asset: discovr-usb-macos-arm64.zip
          - os: macos-15-intel
            asset: discovr-usb-macos-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7
      - name: Native Linux desktop build dependencies
        if: runner.os == 'Linux'
        # These libraries are collected into the USB folder; users install nothing.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0 xvfb
      - name: Statically link Intel macOS cryptography
        if: matrix.asset == 'discovr-usb-macos-x64.zip'
        run: python scripts/rebuild_macos_crypto.py
      - run: pyinstaller --noconfirm discovr.spec
      - name: Package the USB app
        run: python scripts/package_usb.py dist/${{ matrix.asset }}
      - name: Smoke test the relocated USB archive
        if: runner.os != 'Linux'
        run: python scripts/smoke_usb.py dist/${{ matrix.asset }}
      - name: Smoke test the native Linux desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_usb.py dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag prepares a draft. Maintainers publish after reviewing CI and release notes.
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --draft
