# Discovr CI/CD: test on every OS, audit dependencies, build the portable binaries,
# and attach them to a GitHub Release when a version tag (v*) is pushed.
name: build

on:
  push:
    branches: [main, Rejuvinate-Discovr]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job may write.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails the build when a runtime dependency has a published vulnerability.
      - run: python -m pip install pip-audit && pip-audit -r requirements.txt

  build:
    name: binary (${{ matrix.asset }})
    needs: [test, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: discovr-windows-x64.exe
          # Oldest supported runner = oldest glibc = widest Linux compatibility.
          - os: ubuntu-22.04
            asset: discovr-linux-x64
          - os: macos-latest
            asset: discovr-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm discovr.spec
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=dist/discovr; [ -f dist/discovr.exe ] && BIN=dist/discovr.exe
          "$BIN" --version
          "$BIN" --scan-network 127.0.0.1 --ports 1 --save no
          mv "$BIN" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
